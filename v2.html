  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
  <script src="v2.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const carousel = document.querySelector('.album-cover .swiper')?.swiper;
      if (!carousel || carousel.realIndex === 0) return;

      // Fire the normal slide-change callbacks so the player can update.
      if (carousel.params.loop) {
        carousel.slideToLoop(0, 0, true);
      } else {
        carousel.slideTo(0, 0, true);
      }
    });
  </script>
