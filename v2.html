  <div class="music-player">
    <h1></h1>
    <p></p>

    <audio id="song"></audio>

    <input type="range" id="progress" min="0" value="0" step="any" aria-label="Song progress">

    <div class="controls">
      <button class="backward" type="button" aria-label="Previous song">
        <i class="fa-solid fa-backward"></i>
      </button>
      <button class="play-pause-btn" type="button" aria-label="Play">
        <i class="fa-solid fa-play" id="controlIcon"></i>
      </button>
      <button class="forward" type="button" aria-label="Next song">
        <i class="fa-solid fa-forward"></i>
      </button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
  <script>
    const song = document.getElementById("song");
    const progress = document.getElementById("progress");
    const controlIcon = document.getElementById("controlIcon");
    const playPauseButton = document.querySelector(".play-pause-btn");

    const swiper = new Swiper(".swiper", {
      effect: "coverflow",
      centeredSlides: true,
      initialSlide: 0,
      slidesPerView: "auto",
      grabCursor: true,
      spaceBetween: 40,
      coverflowEffect: {
        rotate: 25,
        stretch: 0,
        depth: 50,
        modifier: 1,
        slideShadows: false
      },
      navigation: {
        nextEl: ".forward",
        prevEl: ".backward"
      }
    });

    function loadActiveTrack() {
      song.src = swiper.slides[swiper.activeIndex].dataset.audio;
      progress.value = 0;
    }

    function updatePlayIcon() {
      controlIcon.classList.toggle("fa-play", song.paused);
      controlIcon.classList.toggle("fa-pause", !song.paused);
      playPauseButton.setAttribute("aria-label", song.paused ? "Play" : "Pause");
    }

    function playOnPageClick(event) {
      if (event.target.closest("a, button, input")) return;
      if (song.paused) playSong();
    }

    async function playSong(allowPageClickFallback = false) {
      try {
        await song.play();
        document.removeEventListener("click", playOnPageClick, true);
      } catch (error) {
        if (error.name === "NotAllowedError" && allowPageClickFallback) {
          document.addEventListener("click", playOnPageClick, true);
        } else if (error.name !== "AbortError" && error.name !== "NotAllowedError") {
          console.warn("Could not play the track", error);
        }
        updatePlayIcon();
      }
    }

    playPauseButton.addEventListener("click", () => {
      if (song.paused) {
        playSong();
      } else {
        song.pause();
      }
    });

    song.addEventListener("play", updatePlayIcon);
    song.addEventListener("pause", updatePlayIcon);

    song.addEventListener("loadedmetadata", () => {
      if (Number.isFinite(song.duration)) progress.max = song.duration;
      progress.value = song.currentTime;
    });

    song.addEventListener("timeupdate", () => {
      progress.value = song.currentTime;
    });

    progress.addEventListener("input", () => {
      if (Number.isFinite(song.duration)) {
        song.currentTime = Number(progress.value);
      }
    });

    progress.addEventListener("change", () => {
      playSong();
    });

    swiper.on("slideChange", () => {
      loadActiveTrack();
      playSong(true);
    });

    song.addEventListener("ended", () => {
      updatePlayIcon();
      swiper.slideNext();
    });

    loadActiveTrack();
    playSong(true);
  </script>
</body>
